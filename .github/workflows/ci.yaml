name: CI/CD — build, test, and deploy to AWS

# Replaces the upstream Docker-publish workflow (which pushed to ghcr.io/x402-rs/...
# and docker.io/ukstv/... — namespaces this fork cannot write to, so it always failed).
#
# This pipeline:
#   - on every PR and push to main: build + run the test suite (the green gate)
#   - on push to main (once AWS secrets are set): build the image, push to AWS ECR,
#     and `terraform apply` the new image to ECS production, then verify.
#
# AWS auth: IAM access keys stored as repo secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY.
# See docs/CICD_SETUP.md for the IAM policy and secret setup. Until those secrets exist,
# the deploy job is skipped (the run still goes green on the test job).

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  # The ECR registry host carries the account ID; it comes from the login step
  # (`steps.ecr.outputs.registry`), never from this file. The repo is public.
  ECR_REPOSITORY_NAME: facilitator
  ECS_CLUSTER: facilitator-production
  ECS_SERVICE: facilitator-production
  CARGO_FEATURES: solana,near,stellar,algorand,sui,xrpl

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The landing page states network counts in three places -- the English
      # markup, the `en` dictionary and the `es` dictionary -- and until
      # 2026-09-02 only the first was ever checked, by a script whose own
      # docstring asked to be wired here and never was (`grep -rn
      # verify_landing_canonical .github/` returned nothing). --offline skips
      # the one producer that needs the network, GET /supported: a CI check that
      # calls production turns a production outage into a red build, which is
      # the worst possible moment to block a deploy. Everything else -- escrow,
      # ERC-8004 and the whole EN/ES cross-check -- runs from the repository.
      - name: Landing page matches its canonical sources (offline)
        run: python3 scripts/verify_landing_canonical.py --offline
      - name: Build (all production features)
        run: cargo build --locked --features ${{ env.CARGO_FEATURES }}
      # --test-threads=1: tests are fast (compile dominates), and running them
      # serially avoids a flaky parallel-execution hang seen on CI runners.
      - name: Test facilitator (x402-rs, all features)
        run: cargo test --locked -p x402-rs --features ${{ env.CARGO_FEATURES }} -- --test-threads=1
      - name: Test workspace crates (axum, reqwest, compliance — incl. doctests)
        run: cargo test --locked -p x402-axum -p x402-reqwest -p x402-compliance -- --test-threads=1

  preflight:
    name: Check deploy prerequisites
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - id: check
        env:
          HAS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "AWS credentials present — deploy will run on main."
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are not set. Add them (see docs/CICD_SETUP.md) to enable auto-deploy."
          fi

  # ---------------------------------------------------------------------------
  # The drift gate: does main contain infrastructure the deploy will never apply?
  # ---------------------------------------------------------------------------
  #
  # The deploy job applies Terraform with an explicit -target list, on purpose: a
  # release must roll the image and nothing else. The cost of that is a hole with
  # no floor. A change to any resource outside the list merges into main, CI goes
  # green, and it never reaches AWS. Nothing reports it, because a resource that
  # was never planned produces no diff to notice.
  #
  # Three incidents in one week came out of that hole:
  #
  #   2026-08-20  the balances Lambda      had been un-deployable since it existed
  #   2026-08-28  the CI user's IAM policy invisible until a deploy crashed on it
  #   2026-08-29  the autoscaling policies unapplied through a 3x traffic spike
  #
  # Each was fixed by adding another -target. This job is the general case: it
  # plans the WHOLE configuration and fails when something in it lies outside
  # what a deploy can reach.
  #
  # THIS JOB ONLY READS. It never applies, and `deploy` deliberately does NOT
  # list it in `needs` -- pre-existing drift must not be able to block a release.
  # Widening the -target lists to auto-apply the foundational block (VPC, ALB,
  # security groups, IAM, DynamoDB) was the other option and was rejected: none
  # of it has had a plan run against it in this pipeline's lifetime, so nobody
  # knows what an apply there would do, and finding out under production traffic
  # is worse than the hole it would close.
  plan:
    name: Terraform plan (drift gate)
    needs: [preflight]
    if: needs.preflight.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    # Separate from the deploy's concurrency group: a superseded plan is worthless,
    # but it must never sit in the queue a release is waiting in.
    concurrency:
      group: tfplan-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          # Must match the deploy job. The state was written by 1.9.8 and a newer
          # binary upgrades it on contact, which locks 1.9.8 out afterwards.
          terraform_version: "1.9.8"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Plan
        working-directory: terraform/environments/production
        run: |
          set -o pipefail
          terraform init -input=false

          # What a deploy CAN apply is not the literal -target list. A targeted apply
          # also applies that target's dependencies, and that is not a footnote: it is how
          # aws_lb.main ended up inside the image deploy's blast radius and had
          # alb_idle_timeout reverted under it on 2026-08-14. Guessing that closure by
          # hand would make this gate wrong in both directions -- crying about changes
          # the deploy does apply, and staying quiet about ones it does not.
          #
          # So ask Terraform, with the same flags the deploy uses. The flags are read
          # out of THIS file instead of copied here, so adding a -target to a deploy
          # step narrows this gate in the same commit and the two cannot drift apart.
          #
          # The regex is spelled [-]target= deliberately: written literally it would
          # match its own source line and this job would declare everything covered.
          mapfile -t TARGETS < <(grep -oE '[-]target=[A-Za-z0-9_.]+' "$GITHUB_WORKSPACE/.github/workflows/ci.yaml" | sort -u)
          if [ "${#TARGETS[@]}" -eq 0 ]; then
            echo "::error title=Drift gate cannot run::No -target flags found in ci.yaml. Without them this job cannot tell covered from uncovered, and a gate that guesses is worse than no gate."
            exit 1
          fi
          # A target flag written into PROSE in this file silently widens the covered
          # set and quietly disarms the gate. Caught exactly once while writing this
          # job, in its own comment. Every extraction must look like a resource address.
          for t in "${TARGETS[@]}"; do
            case "${t#-target=}" in
              aws_*|module.*|data.*) ;;
              *) echo "::error title=Drift gate cannot run::Extracted '${t}', which is not a resource address. Some prose in ci.yaml contains a literal target flag; rewrite it."; exit 1 ;;
            esac
          done
          echo "A deploy covers ${#TARGETS[@]} targets, plus their dependencies."

          # -lock=false: a plan only reads state. Taking the lock would let a PR check
          #   stall a production deploy -- a worse failure than a slightly stale plan.
          # no -var image_tag: image-pin.tf then resolves to the image ALREADY RUNNING,
          #   so the task definition is a no-op here. Passing the built tag instead would
          #   put a task-definition diff on every single PR and teach everyone to ignore
          #   this job by the end of the first week.
          # no -refresh=false: it invents drift.
          #
          # Targeted first, then full. A deploy landing between the two can only remove
          # rows from the full plan, never add them, so the race resolves toward silence
          # rather than toward a false accusation.
          if ! terraform plan -input=false -lock=false -no-color -out=targeted.tfplan "${TARGETS[@]}" > targeted.log 2>&1; then
            echo "::error title=Drift gate failed::The targeted plan errored; see the log below."
            tail -60 targeted.log
            exit 1
          fi

          terraform plan -input=false -lock=false -no-color -detailed-exitcode -out=full.tfplan > full.log 2>&1
          code=$?
          # -detailed-exitcode: 0 = empty, 2 = changes present, 1 = the plan itself broke.
          if [ "$code" = "1" ]; then
            echo "::error title=Drift gate failed::terraform plan errored; see the log below."
            tail -80 full.log
            exit 1
          fi
          echo "Full plan exit code: $code"

      - name: Report changes the deploy will never apply
        working-directory: terraform/environments/production
        run: |
          set -o pipefail
          CHANGED='.resource_changes[]? | select(.change.actions != ["no-op"] and .change.actions != ["read"])'

          terraform show -json full.tfplan     > full.json
          terraform show -json targeted.tfplan > targeted.json

          jq -r "$CHANGED | .address" full.json     | sort -u > full.addrs
          # Covered = what the targeted plan would touch (dependencies included), plus
          # the literal targets themselves. The second half matters when the targeted
          # plan comes back empty but the full plan is a few seconds younger.
          jq -r "$CHANGED | .address" targeted.json | sort -u > covered.addrs
          grep -oE '[-]target=[A-Za-z0-9_.]+' "$GITHUB_WORKSPACE/.github/workflows/ci.yaml" \
            | sed 's/^-target=//' >> covered.addrs
          sort -u -o covered.addrs covered.addrs
          comm -23 full.addrs covered.addrs > uncovered.addrs

          # A row nobody can act on is a row that gets muted. Each one carries the
          # action, the file that declares it, and which attributes actually differ.
          row() {
            addr="$1"
            base="${addr%%[*}"; rtype="${base%%.*}"; rname="${base#*.}"
            file=$(grep -lE "^resource[[:space:]]+\"$rtype\"[[:space:]]+\"$rname\"" ./*.tf 2>/dev/null | head -1 | sed 's|^\./||')
            action=$(jq -r --arg a "$addr" '.resource_changes[] | select(.address==$a) | .change.actions | join("+")' full.json)
            attrs=$(jq -r --arg a "$addr" '
              .resource_changes[] | select(.address==$a) | .change
              | (.before // {}) as $b | (.after // {}) as $x
              | [ ($b|keys) + ($x|keys) | unique | .[] ]
              | map(select($b[.] != $x[.]))
              | if length > 6 then (.[0:6] + ["..."]) else . end
              | join(", ")' full.json)
            printf '| `%s` | `%s` | %s | %s |\n' "$action" "$addr" "${file:-?}" "${attrs:--}"
          }

          {
            echo "## Terraform drift gate"
            echo
            pending=$(comm -12 full.addrs covered.addrs)
            if [ -n "$pending" ]; then
              echo "### Pending, but a deploy applies these - not a failure"
              echo
              echo "| Action | Resource | Declared in | Attributes |"
              echo "|---|---|---|---|"
              printf '%s\n' "$pending" | while read -r a; do [ -n "$a" ] && row "$a"; done
              echo
            fi
            if [ ! -s uncovered.addrs ]; then
              echo "**Clean.** Everything the configuration asks for is either already live or inside the deploy's reach."
            else
              echo "### Outside the deploy's reach - merging this does NOT ship it"
              echo
              echo "| Action | Resource | Declared in | Attributes |"
              echo "|---|---|---|---|"
              while read -r a; do [ -n "$a" ] && row "$a"; done < uncovered.addrs
              echo
              echo "Apply these by hand, from a machine running Terraform 1.9.8, with a human's"
              echo "credentials and after reading the plan - or add the resource to a deploy"
              echo "step's -target list if it genuinely belongs in every release."
              echo
              echo "<details><summary>Full plan output</summary>"
              echo
              echo '```'
              cat full.log
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -s uncovered.addrs ]; then
            while read -r a; do
              [ -n "$a" ] && echo "::error title=Unapplied infrastructure::${a} differs from AWS and no deploy step targets it."
            done < uncovered.addrs
            echo
            echo "Drift the pipeline will never apply:"
            cat uncovered.addrs
            exit 1
          fi
          echo "No unapplied infrastructure."

  deploy:
    name: Push to ECR & deploy to ECS (production)
    needs: [test, preflight]
    # Deploy on a push to main OR a manual "Run workflow" on main, once AWS secrets exist.
    if: >-
      needs.preflight.outputs.deploy == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # ~16-min image build + terraform + ECS rollout wait; 50 leaves headroom so the
    # "wait for stable" + verify steps complete (30 was cut off mid-rollout).
    timeout-minutes: 50
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag (version + short SHA)
        id: tag
        run: |
          # The release version lives in ./VERSION, not Cargo.toml. Keeping it out
          # of the manifest is what lets the Docker dependency layer survive a
          # release: Cargo.toml no longer changes, so the ~15 min dependency
          # recompile every deploy used to pay is gone. See src/version.rs.
          VER=$(tr -d '[:space:]' < VERSION)
          if [ -z "$VER" ]; then echo "::error::VERSION file is empty"; exit 1; fi
          SHA=$(git rev-parse --short HEAD)
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${VER}-${SHA}" >> "$GITHUB_OUTPUT"
          echo "Deploying image tag: ${VER}-${SHA}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            FACILITATOR_VERSION=${{ steps.tag.outputs.version }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_NAME }}:${{ steps.tag.outputs.image_tag }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform apply (roll ECS to the new image)
        working-directory: terraform/environments/production
        run: |
          terraform init -input=false
          # Targeted apply scopes the deploy to the ECS task def + service so it ONLY rolls
          # the image. A *full* apply additionally wants lambda:UpdateFunctionCode every run
          # (the archive_file zip hashes differently in CI than in state) and an ALB attribute
          # modify -- neither belongs in an image deploy. -target avoids the Lambda entirely.
          #
          # The ALB-attribute modify it pulls in (the service's ALB dependency) is NOT a
          # no-op, whatever this comment used to claim. terraform.tfvars is gitignored, so
          # this checkout does not have it and every apply here runs on the DEFAULTS in
          # variables.tf. When a default disagreed with the tfvars value, each deploy quietly
          # reverted the setting -- CloudTrail on 2026-08-14 caught it doing exactly that to
          # alb_idle_timeout, 600 -> 180, minutes after an operator set it. The defaults now
          # match tfvars; if you change one, change the other, or the next deploy undoes you.
          # Do NOT use -refresh=false (invents drift).
          # Autoscaling resources ride along in this same -target set. They already sit
          # downstream of aws_ecs_service.facilitator (resource_id references its name), so
          # this adds no new dependency pull -- but leaving them out is exactly how the
          # 2026-08-29 incident happened: the ALB-request-count policy sat in main.tf for a
          # day, unapplied, while CPU/memory (which don't fire for an I/O-bound service) were
          # the only live policies and the service never scaled during a 3x traffic spike.
          terraform apply -input=false -auto-approve \
            -target=aws_ecs_task_definition.facilitator \
            -target=aws_ecs_service.facilitator \
            -target=aws_appautoscaling_target.ecs_target \
            -target=aws_appautoscaling_policy.ecs_alb_request_count \
            -target=aws_appautoscaling_policy.ecs_memory \
            -var="image_tag=${{ steps.tag.outputs.image_tag }}"

      - name: Deploy balances Lambda (only when its sources changed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: terraform/environments/production
        run: |
          # The image deploy above deliberately excludes the Lambda, for the archive_file
          # hash reason explained there. But excluding it from EVERY run means a change to
          # lambda/balances/ lands in main and is never applied -- which is exactly how
          # RPC_URL_SUI stayed pointed at a dead endpoint in the Lambda on 2026-08-20 while
          # the same fix went live for the facilitator in the very same commit.
          #
          # So apply it, but only when its own sources changed. Failure to determine that
          # falls through to applying: a redundant UpdateFunctionCode is cheap, a silently
          # unapplied change is what we are fixing.
          #
          # That fallback doubles as the manual escape hatch: a workflow_dispatch run has no
          # `github.event.before`, so the compare fails and the Lambda is applied. Use it to
          # resync the Lambda when it drifted from main (which is how it was first fixed).
          if files=$(gh api "repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}" --jq '.files[].filename' 2>/dev/null); then
            if printf '%s\n' "$files" | grep -qE '^(lambda/balances/|terraform/environments/production/lambda-balances\.tf$)'; then
              echo "Balances Lambda sources changed; applying."
            else
              echo "No balances Lambda changes in this push; skipping."
              exit 0
            fi
          else
            echo "Could not list changed files; applying to be safe."
          fi
          terraform init -input=false
          terraform apply -input=false -auto-approve \
            -target=aws_lambda_function.balances

      - name: Deploy observability (SNS topic, alarms, schedule)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: terraform/environments/production
        run: |
          # Same shape as the balances-Lambda step above, and for the same reason: these
          # resources are outside the image deploy's -target list, so without their own
          # step they would sit in main unapplied.
          #
          # This is the alerting the facilitator did not have until 2026-08-21. Five alarms
          # had `alarm_actions = []` and the other three published to Execution Market's
          # SNS topic -- we found out about our own outages from another team's email.
          if files=$(gh api "repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}" --jq '.files[].filename' 2>/dev/null); then
            if printf '%s\n' "$files" | grep -qE '^terraform/environments/production/(alerts\.tf|alerts-imported\.tf|cloudwatch-.*\.tf|variables\.tf)$'; then
              echo "Observability config changed; applying."
            else
              echo "No observability changes in this push; skipping."
              exit 0
            fi
          else
            echo "Could not list changed files; applying to be safe."
          fi
          terraform init -input=false
          # orphan_5xx_errors / orphan_latency_p99 / orphan_no_running_tasks (alerts-imported.tf)
          # describe three alarms that were created by hand, outside Terraform, years before
          # this. PutMetricAlarm upserts by name, so applying these targets before anyone runs
          # `terraform import` does not fail -- it just overwrites the hand-created alarm to
          # match the .tf (adding our own SNS topic to its actions) and starts tracking it in
          # state from here. That is a convenient side effect, not a substitute for import: if
          # you import first (recommended, see alerts-imported.tf), this step becomes a no-op
          # for that resource on the following run.
          terraform apply -input=false -auto-approve \
            -target=aws_sns_topic.alerts \
            -target=aws_sns_topic_subscription.alerts_email \
            -target=aws_sqs_queue.alerts_backup \
            -target=aws_sqs_queue_policy.alerts_backup \
            -target=aws_sns_topic_subscription.alerts_backup_sqs \
            -target=aws_cloudwatch_metric_alarm.chain_rpc_unreachable \
            -target=aws_cloudwatch_metric_alarm.chain_balance_low \
            -target=aws_cloudwatch_event_rule.balances_schedule \
            -target=aws_cloudwatch_event_target.balances_schedule \
            -target=aws_lambda_permission.balances_schedule \
            -target=aws_iam_role_policy.balances_lambda_secrets \
            -target=aws_cloudwatch_metric_alarm.near_settlement_failure_rate \
            -target=aws_cloudwatch_metric_alarm.near_rpc_errors \
            -target=aws_cloudwatch_metric_alarm.caip2_parsing_errors_high \
            -target=aws_cloudwatch_metric_alarm.v2_settlement_failure_rate \
            -target=aws_cloudwatch_metric_alarm.latency_p99_early \
            -target=aws_cloudwatch_metric_alarm.orphan_5xx_errors \
            -target=aws_cloudwatch_metric_alarm.orphan_latency_p99 \
            -target=aws_cloudwatch_metric_alarm.orphan_no_running_tasks

      - name: Wait for ECS rollout to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Verify deployment health
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://facilitator.ultravioletadao.xyz/health || true)
            ver=$(curl -s --max-time 10 https://facilitator.ultravioletadao.xyz/version || true)
            echo "attempt $i: /health=$code /version=$ver"
            [ "$code" = "200" ] && { echo "Facilitator healthy."; exit 0; }
            sleep 6
          done
          echo "::error::Facilitator did not return healthy /health after rollout."
          exit 1
