name: No AWS account ID in the repo

# This repo is public. The AWS account ID and the random suffixes that Secrets Manager
# appends to secret ARNs must not live in documentation or in the agent definitions
# under .claude/: they are read at runtime (aws sts get-caller-identity,
# aws secretsmanager describe-secret) and never written down. Placeholders are
# <AWS_ACCOUNT_ID> and <name>-<SUFIJO>. This gate fails when either comes back.
#
# It runs on every push and pull request, on every branch: a leak is cheaper to
# catch before it reaches main, and the check takes seconds.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  no-account-id:
    name: No AWS account ID in the repo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan the whole tree for account ARNs, ECR hosts and secret suffixes; docs for bare IDs
        shell: bash
        run: |
          set -uo pipefail
          # Two surfaces. The STRUCTURAL rules (an ARN carrying an account, an ECR host,
          # a secret name with its suffix) run over EVERY tracked file: terraform reads
          # the account from data.aws_caller_identity, ci.yaml from the ECR login step,
          # the scripts from `aws sts get-caller-identity`, so nothing legitimate
          # matches. The bare-12-digit rule stays on docs and .claude/ only: code and
          # test fixtures carry 12-digit amounts and chain constants that are not IDs.
          mapfile -t all < <(git ls-files | sort -u)
          mapfile -t files < <(git ls-files -- '*.md' '.claude' | sort -u)
          fail=0

          # 1) An ARN that carries an account: arn:aws:<service>:<region>:<12 digits>:
          hits=$(grep -nIE 'arn:aws:[a-z0-9-]*:[a-z0-9-]*:[0-9]{12}:' "${all[@]}" | grep -v '^.github/workflows/no-account-id.yml' || true)
          if [ -n "$hits" ]; then echo "::error::ARN with an AWS account ID -- interpolate it (terraform: data.aws_caller_identity) or write <AWS_ACCOUNT_ID>:"; echo "$hits"; fail=1; fi

          # 1b) An ECR registry host: <12 digits>.dkr.ecr.<region>.amazonaws.com
          hits=$(grep -nIE '[0-9]{12}\.dkr\.ecr\.' "${all[@]}" | grep -v '^.github/workflows/no-account-id.yml' || true)
          if [ -n "$hits" ]; then echo "::error::ECR host with an AWS account ID -- derive it from the login step or sts:"; echo "$hits"; fail=1; fi

          # 2) A bare 12-digit number: account IDs, ECR hostnames, S3 bucket suffixes.
          #    The lookarounds cut on a letter or a digit but NOT on _: 12 digits inside a hex
          #    string (0x000000000022D473..., Permit2) stay out, tfstate_<account> is caught.
          #    Two 12-digit values in the docs are not account IDs and are allowed:
          #      017700000001  octal encoding of 127.0.0.1, a test vector shared with src/discovery.rs
          #      380517503805  a Superfluid flow-rate example
          hits=$(grep -nIP '(?<![0-9A-Za-z])[0-9]{12}(?![0-9A-Za-z])' "${files[@]}" | grep -vE '017700000001|380517503805' || true)
          if [ -n "$hits" ]; then echo "::error::12-digit number (an AWS account ID?) -- write <AWS_ACCOUNT_ID>, or allow-list it here if it is not one:"; echo "$hits"; fail=1; fi

          # 3) A Secrets Manager name with its random suffix (6 chars, at least one digit or
          #    capital), e.g. facilitator-rpc-mainnet-AbC123. Docs carry the logical name
          #    plus -<SUFIJO>; the real ARN is resolved at runtime.
          hits=$(grep -nIP '(facilitator|karmacadabra)[a-z0-9/_-]*-(?=[A-Za-z0-9]{6}\b)(?=[a-z]*[A-Z0-9])[A-Za-z0-9]{6}\b' "${all[@]}" | grep -v '^.github/workflows/no-account-id.yml' || true)
          if [ -n "$hits" ]; then echo "::error::Secrets Manager name with its random suffix -- write <name>-<SUFIJO>:"; echo "$hits"; fail=1; fi

          if [ "$fail" -ne 0 ]; then
            echo "This repo is public. The account ID and the secret suffixes are read at runtime"
            echo "(aws sts get-caller-identity / aws secretsmanager describe-secret), never written down."
            exit 1
          fi
          echo "OK: no account ARN, ECR host or secret suffix in ${#all[@]} files; no bare account ID in ${#files[@]} docs."
