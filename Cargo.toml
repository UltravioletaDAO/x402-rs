[package]
name = "x402-rs"
version = "0.0.0" # frozen placeholder -- the release version lives in ./VERSION (see src/version.rs)
authors = ["Sergey Ukustov <sergey@ukstv.me>", "0xultravioleta <0xultravioleta@gmail.com>"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/x402-rs/x402-rs"
description = "x402 payments in Rust: verify, settle, and monitor payments over HTTP 402 flows"
readme = "README.md"
homepage = "https://x402.rs"
documentation = "https://docs.rs/x402-rs"
keywords = ["blockchain", "payments", "x402", "stablecoin", "http-402"]
categories = ["cryptography", "finance", "network-programming", "web-programming::http-server"]

[dependencies]
axum = { version = "0.8.8" }
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }  # BroadcastStream para GET /events (SSE)
dotenvy = { version = "0.15.7" }
serde_json = { version = "1.0.149" }
tower-http = { version = "0.6.8", features = ["trace", "cors", "limit"] }
tower_governor = { version = "0.8" }
serde = { version = "1.0.228", features = ["derive"] }
once_cell = { version = "1.21.3" }
regex = { version = "1.11.1" }
url = { version = "2.5.8", features = ["serde"] }
alloy = { version = "1.0.12" }
thiserror = { version = "2.0.18" }
base64 = { version = "0.22.1" }
# RFC 4648 base32 for Algorand addresses. Already in the tree (transitive
# dep of stellar-strkey and others), so this adds no crate and no build time.
data-encoding = "2.10"
hex = { version = "0.4" }
rust_decimal = { version = "1.39.0" }
async-trait = { version = "0.1.88" }
dashmap = { version = "6.1.0" }
uuid = { version = "1.21", features = ["v4"] }

# Compliance
x402-compliance = { path = "crates/x402-compliance", features = ["solana"] }

# Solana
solana-sdk = { version = "2.3.1", features = ["full"] }
solana-commitment-config = { version = "2.2.1" } # Older version due to compatibility with solana-sdk
bincode = { version = "1.3.3" } # Older version due to compatibility with solana-sdk
spl-token = { version = "8.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "9.0.0", features = ["no-entrypoint"] }
solana-client = { version = "2.3.7" }
solana-transaction-status-client-types = { version = "2.3.13" }
solana-account-decoder-client-types = { version = "2.3.13" }

# NEAR Protocol (NEP-366 meta-transactions support)
near-jsonrpc-client = { version = "0.20" }
near-jsonrpc-primitives = { version = "0.34" }
near-primitives = { version = "0.34" }
near-crypto = { version = "0.34" }
near-chain-configs = { version = "0.34" }
near-token = { version = "0.3" }
borsh = { version = "1.5" }
bs58 = { version = "0.5" }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = { version = "0.8" }

# Stellar/Soroban
reqwest = { version = "0.12", features = ["json", "multipart"] }
stellar-strkey = { version = "0.0.10" }  # Stellar address encoding/decoding
stellar-xdr = { version = "=21.2.0", default-features = false, features = ["std", "curr"] }  # Stellar XDR types
sha2 = { version = "0.10" }  # SHA-256 for Stellar signature hashing

# Algorand (atomic transaction groups for gasless payments)
algonaut = { version = "0.4", optional = true }  # Umbrella crate for Algorand SDK
rmp-serde = { version = "1.3", optional = true }  # MessagePack for Algorand txns

# XRPL (XRP Ledger pre-signed transaction blobs for gasless payments)
# Note: crate is `xrpl-rust` but its lib name is `xrpl`, so the package must be renamed.
# Trim the default `cli` feature (drags clap+bip39); `std` hard-pins tokio/reqwest (fine, repo is tokio).
xrpl = { package = "xrpl-rust", version = "1.1.0", default-features = false, features = ["std", "tokio-rt", "core", "models", "wallet", "utils", "helpers", "json-rpc"], optional = true }

# Sui (sponsored transactions for gasless payments)
# Note: Sui SDK is not yet stable on crates.io, using git dependencies
# Pin to specific tag for reproducible builds
sui-sdk = { git = "https://github.com/MystenLabs/sui", package = "sui-sdk", tag = "mainnet-v1.37.3", optional = true }
sui-types = { git = "https://github.com/MystenLabs/sui", package = "sui-types", tag = "mainnet-v1.37.3", optional = true }
sui-keys = { git = "https://github.com/MystenLabs/sui", package = "sui-keys", tag = "mainnet-v1.37.3", optional = true }
shared-crypto = { git = "https://github.com/MystenLabs/sui", package = "shared-crypto", tag = "mainnet-v1.37.3", optional = true }
bcs = { version = "0.1", optional = true }  # Binary Canonical Serialization for Sui

# DX402 durable-evidence (src/dx402/)
# All four are already in Cargo.lock transitively (alloy pulls k256/elliptic-curve,
# ed25519-dalek pulls curve25519-dalek), so declaring them direct adds no new
# vendored code -- it only makes the dependency explicit.
aes-gcm = { version = "0.10" }        # AES-256-GCM envelope over the response body
hkdf = { version = "0.12" }           # HKDF-SHA256 to derive the CEK wrapping key
k256 = { version = "0.13", features = ["ecdh", "arithmetic"] }  # secp256k1 ECDH (EVM/XRPL payers)
curve25519-dalek = { version = "4.1" }  # X25519 ECDH for ed25519 payers (Solana/NEAR/Stellar/Algorand/Sui)
subtle = { version = "2.6" }          # constant-time small-order check (RFC 7748 6.1)

# AWS SDK (for Bazaar discovery persistence and nonce store)
aws-config = { version = "1.5" }
aws-sdk-s3 = { version = "1.65" }
aws-sdk-dynamodb = { version = "1.54" }

# Swagger/OpenAPI Documentation
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Tracing and OpenTelemetry
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
opentelemetry = { version = "0.30.0" }
opentelemetry_sdk = { version = "0.30.0" }
opentelemetry-semantic-conventions = { version = "0.30.0", features = ["semconv_experimental"] }
tracing-core = { version = "0.1.34" }
tracing-opentelemetry = { version = "0.31.0" }
opentelemetry-otlp = { version = "0.30.0", features = ["metrics", "grpc-tonic"] }
opentelemetry-stdout = { version = "0.30.0", features = ["trace", "metrics"] }

# MCP (Model Context Protocol) server behind `POST /mcp`.
# `transport-streamable-http-server` is the transport; it is served through
# `tower_service::Service`, NOT through axum -- rmcp declares no axum dependency
# at all, so it mounts with `Router::route_service` and cannot pin our axum
# version. Adds 14 crates to the lock (base64 0.23, rand 0.10, schemars_derive,
# sse-stream, pastey, darling, syn 3, chacha20, cpufeatures, rmcp-macros) and
# ~16s to a warm `cargo check`. Measured 2026-09-02, see
# docs/handoffs/2026-09-02-mcp-medicion.md.
rmcp = { version = "3.2.0", features = ["server", "transport-streamable-http-server"] }

# `ServiceExt::oneshot`, used to drive one axum `Router` from inside another.
# Was a dev-dependency (router composition in tests); `src/mcp.rs` now calls the
# REST router the same way at runtime, so an MCP tool runs the SAME handler
# stack -- middleware included -- instead of a second copy of the logic.
# Already present transitively via tower-http / tower_governor, so declaring it
# adds no crate. Tests see it from here; a `[dev-dependencies]` copy would only
# be a second place to bump.
tower = { version = "0.5", features = ["util"] }

[features]
telemetry = []
solana = ["x402-compliance/solana"]
near = []
stellar = []
algorand = ["algonaut", "rmp-serde"]
sui = ["sui-sdk", "sui-types", "sui-keys", "shared-crypto", "bcs"]
xrpl = ["dep:xrpl"]

[workspace]
members = [
  "crates/x402-axum",
  "examples/x402-axum-example",
  "crates/x402-reqwest",
  "examples/x402-reqwest-example",
  "crates/x402-compliance",
  "."
]
