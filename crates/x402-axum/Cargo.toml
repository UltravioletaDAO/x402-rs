[package]
name = "x402-axum"
version = "0.6.3"
edition = "2021"
description = "Axum middleware for enforcing x402 protocol payments on protected routes"
license = "Apache-2.0"
authors = ["Sergey Ukustov <sergey@ukstv.me>"]
repository = "https://github.com/x402-rs/x402-rs"
homepage = "https://x402.rs"
documentation = "https://docs.rs/x402-axum"
keywords = ["axum", "middleware", "x402", "payments", "stablecoin"]
categories = ["web-programming::http-server", "authentication", "cryptography", "finance", "network-programming"]
readme = "README.md"

[dependencies]
x402-rs = { path = "../..", default-features = false }
url = { version = "2.5.8", features = ["serde"] }
serde_json = { version = "1.0.149" }
reqwest = { version = "0.12.24" }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = { version = "2.0.18" }
tower = { version = "0.5.3" }
http = { version = "1.4.0" }
once_cell = { version = "1.21.3" }
axum-core = { version = "0.5.6" }

# DX402 durable-evidence post-hook (src/durable.rs)
async-trait = { version = "0.1" }
base64 = { version = "0.22" }
bytes = { version = "1" }
http-body-util = { version = "0.1" }
# for Body::size_hint: lets an oversized body be passed through
# untouched instead of being buffered whole just to be measured.
http-body = { version = "1.0" }
alloy = { version = "1.0.12", features = ["signer-local"] }  # signs the anchor authorization

# Telemetry
tracing = { version = "0.1.44", optional = true }

[dev-dependencies]
axum = { version = "0.8.8" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
k256 = { version = "0.13" }
rand = { version = "0.8" }

[features]
default = []
telemetry = ["dep:tracing", "x402-rs/telemetry"]
